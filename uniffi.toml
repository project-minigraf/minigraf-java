# Generate the Kotlin bindings under the Maven group's package instead of
# UniFFI's default `uniffi.minigraf_ffi`.
[bindings.kotlin]
package_name = "io.github.project_minigraf.minigraf"

# UniFFI objects are AutoCloseable in Kotlin: close() frees the Rust object, which
# releases a cursor or fact log and abandons an unfinished log writer. The shim's
# own close() methods would clash with it, so they get other names here.
[bindings.kotlin.rename]
"MiniGrafCursor.close" = "release"
"MiniGrafFactLog.close" = "release"
"MiniGrafLogWriter.close" = "abandon"
