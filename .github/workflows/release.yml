name: Java Release

on:
  repository_dispatch:
    types: [core-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true

jobs:
  prepare:
    name: Pin version, commit, tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      semver: ${{ steps.ver.outputs.semver }}
      sha: ${{ steps.commit.outputs.sha }}
      base: ${{ steps.base.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}

      - id: ver
        run: |
          V="${{ github.event.client_payload.version || github.event.inputs.version }}"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "semver=${V#v}" >> "$GITHUB_OUTPUT"

      # Releases build from main, except when a maintenance branch v<major>.x
      # exists for the dispatched version's major (e.g. v2.x for a 2.0.3 core
      # patch after main has moved to v3). This keeps breaking changes on main
      # out of patch releases of an older line.
      - name: Select base branch
        id: base
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          MAJOR="${SEMVER%%.*}"
          MAINT="v$MAJOR.x"
          if git ls-remote --exit-code --heads origin "$MAINT" >/dev/null; then
            git fetch origin "$MAINT"
            git checkout -B "$MAINT" FETCH_HEAD
            BRANCH="$MAINT"
          else
            PINNED=$(sed -n 's/^minigraf = "=\{0,1\}\([0-9]*\)\..*/\1/p' Cargo.toml)
            if [ -n "$PINNED" ] && [ "$PINNED" -gt "$MAJOR" ]; then
              echo "::error::main is on minigraf $PINNED.x but $SEMVER was dispatched and there is no $MAINT branch. Create $MAINT from the last $MAJOR.x release tag and re-run."
              exit 1
            fi
            BRANCH=main
          fi
          echo "Releasing $SEMVER from $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Wait for minigraf ${{ steps.ver.outputs.semver }} on crates.io
        run: |
          SEMVER="${{ steps.ver.outputs.semver }}"
          echo "Waiting for minigraf@$SEMVER on crates.io..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s "https://crates.io/api/v1/crates/minigraf/$SEMVER" \
              -H "User-Agent: minigraf-binding/1.0" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('version',{}).get('num',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "$SEMVER" ]; then
              echo "minigraf@$SEMVER is live (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/20: not yet available, waiting 15s..."
            sleep 15
          done
          echo "ERROR: minigraf@$SEMVER not found on crates.io after 5 minutes" >&2
          exit 1
      - name: Pin minigraf version in Cargo.toml
        run: |
          sed -i 's/^minigraf = "[^"]*"/minigraf = "=${{ steps.ver.outputs.semver }}"/' Cargo.toml
          sed -i 's/\(minigraf = {[^}]*version = \"\)[^\"]*/\1=${{ steps.ver.outputs.semver }}/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo update --precise "${{ steps.ver.outputs.semver }}" minigraf

      # Push the pin commit to a throwaway branch only. The tag and the base
      # branch are updated by the tag job, after the test job has passed on this commit.
      - name: Commit and push release branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          else
            echo "Cargo.toml already pinned, skipping commit"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push --force origin "HEAD:refs/heads/release/${{ steps.ver.outputs.tag }}"

  # Run this binding's test suite against the exact pinned core version, and
  # build every native from that commit, before anything becomes visible: no
  # tag, no base-branch update, no publish until it passes. The natives are uploaded
  # as artifacts of this run and picked up by assemble-and-publish.
  test:
    name: Test pinned release
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  tag:
    name: Push tag and update ${{ needs.prepare.outputs.base }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}
          # Parent commit (= base branch) so git can verify the push is a fast-forward.
          fetch-depth: 2

      - name: Push tag, fast-forward base branch, delete release branch
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ]; then
            REFS=("$SHA:refs/heads/$BASE" "$SHA:refs/tags/$TAG")
          elif [ "$EXISTING" = "$SHA" ]; then
            echo "Tag $TAG already points at $SHA, skipping tag push"
            REFS=("$SHA:refs/heads/$BASE")
          else
            echo "::error::Tag $TAG already exists at $EXISTING, but the tested commit is $SHA. Delete the tag and re-run to release the tested commit."
            exit 1
          fi
          # Atomic: the base branch and the tag move together or not at all.
          # Rejected if the branch moved during the release; re-run to re-pin.
          git push --atomic origin "${REFS[@]}"
          git push origin --delete "release/$TAG" \
            || echo "::warning::Could not delete branch release/$TAG"

  assemble-and-publish:
    name: Assemble fat JAR and publish to Maven Central
    needs: [prepare, test, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download all natives
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives-staging
          merge-multiple: false

      - name: Copy natives into resources
        run: |
          RESOURCES=java/src/main/resources/natives
          # <rust target>:<resource dir>; must match NativeLoader.resolve().
          for pair in \
              x86_64-unknown-linux-gnu:linux/x86_64 \
              aarch64-unknown-linux-gnu:linux/aarch64 \
              x86_64-unknown-linux-musl:linux-musl/x86_64 \
              aarch64-unknown-linux-musl:linux-musl/aarch64 \
              universal2:macos/universal \
              x86_64-pc-windows-msvc:windows/x86_64 \
              aarch64-pc-windows-msvc:windows/aarch64; do
            target="${pair%%:*}"; dir="${pair#*:}"
            mkdir -p "$RESOURCES/$dir"
            cp natives-staging/native-$target/* "$RESOURCES/$dir/"
          done
          find "$RESOURCES" -type f | sort

      - name: Build Rust library for bindgen
        run: cargo build --release

      - name: Generate Kotlin bindings
        working-directory: java
        run: ./gradlew generateKotlinBindings

      - name: Publish to Maven Central
        working-directory: java
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.semver }}
        run: ./gradlew publishAllPublicationsToCentralPortal

